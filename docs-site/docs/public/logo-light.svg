  <text x="60" y="70" font-family="'Inter', 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#F8F5FF" text-anchor="middle" letter-spacing="-0.5">mxQ</text>
  <text x="118" y="76" font-family="'Inter', 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" fill="#7C3AED">mx<tspan fill="#1A1228" font-weight="500">Query</tspan></text>
</svg>
