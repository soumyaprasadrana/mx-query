# Local build + run: docker compose up --build
# Copy .env.example to .env first and fill in what you need — everything
# here has a working default except MQB_SESSION_ENCRYPTION_KEY, which you
# should set explicitly for anything beyond a one-off local try (see README).
services:
  mxquery:
    build: .
    ports:
      - "8000:8000"
    environment:
      MQB_SESSION_ENCRYPTION_KEY: ${MQB_SESSION_ENCRYPTION_KEY:-}
      MQB_ADMIN_PASSWORD: ${MQB_ADMIN_PASSWORD:-}
      MQB_LLM_MODEL: ${MQB_LLM_MODEL:-ollama/qwen2.5:1.5b}
      MQB_LLM_API_KEY: ${MQB_LLM_API_KEY:-}
      # 127.0.0.1 from inside a container is the container, not your host —
      # if you're pointing at Ollama running on the host machine (the
      # default MQB_LLM_MODEL above assumes that), use host.docker.internal,
      # not 127.0.0.1. `extra_hosts` below makes that hostname resolve on
      # Linux too (Docker Desktop on Mac/Windows already provides it).
      # Leave MQB_LLM_API_BASE unset entirely for a real hosted provider
      # (OpenAI, Anthropic, etc.) — it doesn't apply there.
      MQB_LLM_API_BASE: ${MQB_LLM_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mxquery-data:/data
    restart: unless-stopped

volumes:
  mxquery-data:
