# Triggered ONLY by a version tag push (e.g. `git tag v1.2.0 && git push --tags`).
# This is the one workflow that actually delivers anything externally —
# frontend.yml/backend.yml are just CI gates on every push/PR, this is release.
#
# It does NOT depend on frontend.yml/backend.yml having already run: GitHub's
# path-filtered `push` triggers are not reliable on a tag-only push (the tag
# often points at a commit already on main with no "new" file changes to
# diff against), so this workflow re-validates backend + frontend itself
# before building/pushing anything. A broken commit should never reach
# Docker Hub just because the tag push didn't happen to re-trigger the
# regular CI workflows.
#
# IMAGE_NAME below assumes a Docker Hub repo named "mx-query" (matching the
# GitHub repo slug) under the soumyaprasadrana namespace — this is still an
# assumption, not confirmed against an actual Docker Hub repo; one-line
# change here if it's named differently. Needs two repo secrets set
# under Settings -> Secrets and variables -> Actions: DOCKER_USERNAME and
# DOCKER_PASSWORD. Docker Hub's own guidance is to put an access token (not
# your real account password) in that second secret regardless of what the
# secret is named — Docker Hub -> Account Settings -> Security -> New
# Access Token — since it's revocable independently of your login password.
name: release

on:
  push:
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: soumyaprasadrana/mx-query

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend tests (scratch db, same as backend.yml)
        working-directory: backend
        env:
          MQB_TENANT_DB_PATH: ${{ runner.temp }}/mqb-release-tenants.db
        run: |
          pip install -e ".[dev]"
          ruff check app tests
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend test + build (same as frontend.yml)
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload frontend build for the GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Docker metadata (semver tags from the git tag: 1.2.0, 1.2, 1, latest)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Zip frontend build
        run: |
          cd frontend-dist
          zip -r "../mxquery-frontend-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mxquery-frontend-${{ github.ref_name }}.zip
