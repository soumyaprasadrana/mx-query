[project]
name = "maximo-mcp-oslc-query-builder-backend"
version = "0.1.0"
description = "Multi-tenant MCP tool-call proxy backend for the Maximo OSLC query builder"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
