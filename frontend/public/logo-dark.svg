  <text x="118" y="76" font-family="'Inter', 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="700" fill="#A78BFA">mx<tspan fill="#F4F0FA" font-weight="500">Query</tspan></text>
